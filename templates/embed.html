<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.css" rel="stylesheet"/>
    <style>
        body, html { margin:0; padding:0; height:100%; background:#000; }
        #player { width:100%; height:100%; }
        .viewers {
            position: absolute; top: 10px; right: 10px; z-index: 100;
            background: #3498db; color: white; padding: 5px 10px; border-radius: 4px;
            font: 14px Arial;
        }
    </style>
</head>
<body>
    <div id="player"></div>
    <div id="viewers" class="viewers">Viewers: <span id="count">0</span></div>

    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/level-selector@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/clappr-pip-plugin@latest"></script>

    <script>
        const player = new Clappr.Player({
            parentId: "#player",
            source: "{{ source }}",
            autoPlay: true,
            width: '100%', height: '100%',
            mute: false,
            plugins: [LevelSelector, ClapprPipPlugin],
            levelSelectorConfig: { title: 'Quality', labels: { 'auto': 'Auto' } },
            pipConfig: { enabled: true },
            hlsjsConfig: {
                xhrSetup: function(xhr, url) {
                    xhr.withCredentials = false;
                }
            }
        });

        const countEl = document.getElementById('count');
        let reported = false;

        // Report viewer only AFTER player starts
        player.on('playbackready', () => {
            if (!reported) {
                fetch(`/viewers/{{ stream_id }}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'inc' })
                });
                reported = true;
            }
        });

        // Decrement on leave
        window.addEventListener('beforeunload', () => {
            if (reported) {
                fetch(`/viewers/{{ stream_id }}`, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'dec' })
                });
            }
        });

        // Update count every 1s
        setInterval(() => {
            fetch(`/viewers/{{ stream_id }}?t=${Date.now()}`)
                .then(r => r.json())
                .then(d => countEl.textContent = d.viewers)
                .catch(() => {});
        }, 1000);
    </script>
</body>
</html>
