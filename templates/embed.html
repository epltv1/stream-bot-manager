<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Clappr + Plugins via CDN (load first for player) -->
    <link href="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/level-selector@latest/level-selector.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/clappr-pip@latest/clappr-pip.min.js"></script>
    
    <style>
        body, html { margin:0; padding:0; height:100%; background:#000; font-family: Arial, sans-serif; }
        #player { width:100%; height:100%; position: relative; }
        .live-indicator {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            background: #e74c3c; color: white; padding: 5px 10px; border-radius: 4px;
            font: bold 14px Arial; transition: background 0.3s ease;
        }
        .live-indicator.online { background: #27ae60; }
        .viewers {
            position: absolute; top: 10px; right: 10px; z-index: 100;
            background: #3498db; color: white; padding: 5px 10px; border-radius: 4px;
            font: 14px Arial;
        }
    </style>
</head>
<body>
    <div id="player"></div>
    <div id="live-indicator" class="live-indicator">CHECKING...</div>
    <div id="viewers" class="viewers">Viewers: <span id="count">{{ viewers }}</span></div>

    <script>
        // Wait for plugins to load, then init player
        document.addEventListener('DOMContentLoaded', function() {
            // Player with auto quality + PiP
            const player = new Clappr.Player({
                parentId: "#player",
                source: "{{ source }}",
                autoPlay: true,
                width: '100%',
                height: '100%',
                mediacontrol: { seekbar: '#000', buttons: '#fff' },
                plugins: { core: [LevelSelector], playback: [ClapprPip] },
                level: { auto: true },
                pip: { enabled: true }
            });

            // Real-time elements
            const liveEl = document.getElementById('live-indicator');
            const countEl = document.getElementById('count');
            let currentViewers = {{ viewers }};

            // Report viewer count (inc on load, dec on unload)
            function reportViewer(action) {
                fetch(`/viewers/{{ stream_id }}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: action })
                }).catch(console.error);
            }
            reportViewer('inc');
            window.addEventListener('beforeunload', () => reportViewer('dec'));
            window.addEventListener('pagehide', () => reportViewer('dec'));

            // Update viewers display
            function updateViewers(count) {
                currentViewers = count;
                countEl.textContent = count;
            }

            // Poll viewers every 1 second
            setInterval(() => {
                fetch(`/viewers/{{ stream_id }}?t=${Date.now()}`)
                    .then(r => r.json())
                    .then(data => updateViewers(data.viewers))
                    .catch(() => console.error('Viewers poll failed'));
            }, 1000);

            // Check stream health (live/offline)
            function checkHealth() {
                fetch(`/health/{{ stream_id }}?t=${Date.now()}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.live) {
                            liveEl.textContent = 'LIVE';
                            liveEl.classList.add('online');
                        } else {
                            liveEl.textContent = 'OFFLINE';
                            liveEl.classList.remove('online');
                        }
                    })
                    .catch(() => {
                        liveEl.textContent = 'ERROR';
                        liveEl.classList.remove('online');
                    });
            }

            // Initial check + poll every 5 seconds
            checkHealth();
            setInterval(checkHealth, 5000);
        });
    </script>
</body>
</html>
