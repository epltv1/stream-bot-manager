<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.css" rel="stylesheet"/>
    <style>
        body, html { margin:0; padding:0; height:100%; background:#000; }
        #player { width:100%; height:100%; }
        .live-indicator {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            background: #e74c3c; color: white; padding: 5px 10px; border-radius: 4px;
            font: bold 14px Arial; transition: 0.3s;
        }
        .live-indicator.online { background: #27ae60; }
        .viewers {
            position: absolute; top: 10px; right: 10px; z-index: 100;
            background: #3498db; color: white; padding: 5px 10px; border-radius: 4px;
            font: 14px Arial;
        }
    </style>
</head>
<body>
    <div id="player"></div>
    <div id="live-indicator" class="live-indicator">CHECKING...</div>
    <div id="viewers" class="viewers">Viewers: <span id="count">0</span></div>

    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/level-selector@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/clappr-pip-plugin@latest"></script>

    <script>
        new Clappr.Player({
            parentId: "#player",
            source: "{{ source }}",
            autoPlay: true,
            width: '100%', height: '100%',
            plugins: [LevelSelector, ClapprPipPlugin],
            levelSelectorConfig: { title: 'Quality', labels: { 'auto': 'Auto' } },
            pipConfig: { enabled: true }
        });

        const liveEl = document.getElementById('live-indicator');
        const countEl = document.getElementById('count');

        function report(action) {
            fetch(`/viewers/{{ stream_id }}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action })
            }).catch(() => {});
        }
        report('inc');
        window.addEventListener('beforeunload', () => report('dec'));

        setInterval(() => {
            fetch(`/viewhers/{{ stream_id }}?t=${Date.now()}`)
                .then(r => r.json())
                .then(d => countEl.textContent = d.viewers)
                .catch(() => {});
        }, 1000);

        function check() {
            fetch(`/health/{{ stream_id }}?t=${Date.now()}`)
                .then(r => r.json())
                .then(d => {
                    liveEl.textContent = d.live ? 'LIVE' : 'OFFLINE';
                    liveEl.classList.toggle('online', d.live);
                })
                .catch(() => liveEl.textContent = 'ERROR');
        }
        check();
        setInterval(check, 5000);
    </script>
</body>
</html>
